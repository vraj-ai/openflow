[workspace]
resolver = "3"
members = ["crates/core", "crates/engines", "crates/platform", "crates/cli"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vrajmgupta/openflow"

[workspace.dependencies]
openflow-core = { path = "crates/core" }
openflow-engines = { path = "crates/engines" }
openflow-platform = { path = "crates/platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 3
