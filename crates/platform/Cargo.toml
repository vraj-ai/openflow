[package]
name = "openflow-platform"
description = "OS integration: global hotkeys, microphone capture, paste, frontmost app, accessibility."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openflow-core.workspace = true
anyhow.workspace = true
log.workspace = true
cpal = "0.18"
arboard = { version = "3.6", default-features = false }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
notify-rust = "4.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xinput", "xtest"] }
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
